<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>그것은 알기 싫다 아카이브</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1f;--sub:#6b6b70;--line:#e4e2dc;--acc:#c0392b;--acc2:#fbeae7;--mark:#ffe58a}
*{box-sizing:border-box}body{margin:0;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:20;background:#1d1d1f;color:#fff;padding:12px 24px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
header .logo{font-weight:800;font-size:18px;letter-spacing:-.5px;white-space:nowrap}header .logo span{color:#ff6b5b}
header nav a{color:#bbb;margin-right:14px;font-size:14px}header nav a.on{color:#fff;font-weight:700}
.sbox{flex:1;display:flex;gap:6px;min-width:320px}
.sbox input,.sbox select{border:0;border-radius:8px;padding:9px 12px;font:inherit}
.sbox input[type=search]{flex:1}.sbox input[type=month]{width:140px}.sbox select{max-width:130px}
.sbox button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:0 16px;font-weight:700}
main{max-width:1240px;margin:0 auto;padding:22px 24px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}.sub{color:var(--sub);font-size:13px}
.cloud{line-height:2.1}.cloud a{display:inline-block;margin:0 9px 0 0;color:#333}.cloud a:hover{color:var(--acc);text-decoration:underline}
.chips a,.chip{display:inline-block;padding:3px 10px;border-radius:99px;background:#efede7;margin:0 6px 6px 0;font-size:13px}
.chips a:hover{background:var(--acc2);color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}.pcard:hover{border-color:var(--acc)}
.pcard b{font-size:16px}.pcard .kw{margin-top:8px;font-size:12px;color:var(--sub);line-height:1.6}
.tabs{display:flex;gap:4px;margin:6px 0 14px;border-bottom:2px solid var(--line)}
.tabs button{border:0;background:none;padding:9px 16px;font-weight:700;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--acc);border-color:var(--acc)}
.bars{display:flex;align-items:flex-end;gap:4px;height:70px;margin-top:6px}
.bars div{flex:1;background:#e3b5ad;border-radius:3px 3px 0 0;position:relative;min-height:2px;cursor:pointer}.bars div:hover{background:var(--acc)}
.bars div span{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--sub)}
.ep{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.ep .hd{padding:12px 16px;display:flex;gap:12px;align-items:baseline;cursor:pointer}.ep .hd:hover{background:#faf9f6;border-radius:12px}
.ep .hd .d{color:var(--sub);font-size:13px;white-space:nowrap;width:86px}.ep .hd .t{flex:1;font-weight:700}
.ep .hd .n{color:var(--acc);font-weight:800;white-space:nowrap}.ep .sp{padding:0 16px 8px 114px;font-size:12px}
.ep .qs{padding:4px 16px 12px 114px;display:none}.ep.open .qs{display:block}
.q{padding:6px 0;border-top:1px dashed var(--line);display:flex;gap:10px;font-size:14px;line-height:1.6}
.q .ts{color:var(--sub);font-size:12px;white-space:nowrap;padding-top:2px;cursor:pointer}.q .ts:hover{color:var(--acc)}
.who{font-weight:700;white-space:nowrap}.q .tx{flex:1}
mark{background:var(--mark);padding:0 1px;border-radius:2px}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.col{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;max-height:620px;overflow:auto}
.col .q{display:block}.col .meta{font-size:12px;color:var(--sub);cursor:pointer}.col .meta:hover{color:var(--acc)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:1px}
.epv .top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.epv .ttl{font-size:21px;font-weight:800;margin:4px 0}
.tr{margin-top:6px}.tr .q{border-top:1px solid #f0eee9;padding:7px 4px}.tr .q.hit{background:#fff8dc}.tr .q.cur{background:#fde7e3}
.player{position:fixed;left:0;right:0;bottom:0;background:#1d1d1f;color:#fff;padding:10px 24px;display:none;align-items:center;gap:14px;z-index:30}
.player audio{flex:1;height:36px}.player .pt{font-size:13px;max-width:40%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player button,.player .btn{background:#333;color:#fff;border:0;border-radius:6px;padding:6px 10px}
.btn{background:#efede7;border:0;border-radius:8px;padding:6px 12px;font-size:13px}.btn:hover{background:var(--acc2);color:var(--acc)}
.btn.acc{background:var(--acc);color:#fff}
.find{display:flex;gap:6px;margin:10px 0}.find input{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit}
.namu{font-size:14px;line-height:1.7;color:#444;background:#faf9f6;border-radius:8px;padding:10px 14px;margin-top:10px}
table.list{width:100%;border-collapse:collapse;font-size:14px}table.list td{padding:7px 8px;border-top:1px solid var(--line)}table.list tr:hover td{background:#faf9f6;cursor:pointer}
.empty{padding:40px;text-align:center;color:var(--sub)}.help{font-size:12px;color:var(--sub);margin-top:6px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}

.load{position:sticky;top:64px;z-index:15;background:#fff8e6;border-bottom:1px solid #f0e2b8;padding:6px 24px;font-size:13px;color:#7a6320;display:flex;gap:10px;align-items:center}
.load .bar{flex:0 0 200px;height:6px;background:#f0e2b8;border-radius:3px;overflow:hidden}.load .bar i{display:block;height:100%;background:#d8a93a;width:0}
a.ts{color:var(--sub);font-size:12px;white-space:nowrap;padding-top:2px}a.ts:hover{color:var(--acc)}
.player{position:fixed;left:0;right:0;bottom:0;background:#1d1d1f;color:#fff;padding:10px 24px;display:none;align-items:center;gap:14px;z-index:30}
.player audio{flex:1;height:36px}.player .pt{font-size:13px;max-width:35%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player button{background:#333;color:#fff;border:0;border-radius:6px;padding:6px 10px}

@media (max-width:720px){
 body{font-size:14.5px}
 header{position:static;padding:10px 12px 12px;gap:8px 10px}
 header .logo{font-size:16px}
 header nav{margin-left:auto}header nav a{margin:0 0 0 12px;font-size:13.5px}
 .sbox{flex:1 1 100%;min-width:0;flex-wrap:wrap;gap:6px}
 .sbox input,.sbox select{min-width:0;padding:9px 10px;font-size:15px}
 .sbox input[type=search]{flex:1 1 calc(100% - 76px);order:1}
 .sbox button{order:2;flex:0 0 68px;padding:0}
 .sbox select{order:3;flex:1 1 30%;max-width:none;font-size:13px}
 .sbox input[type=month]{order:4;flex:1 1 30%;width:auto;font-size:13px;padding:7px 6px}
 .load{position:static;padding:6px 12px}.load .bar{flex:1 1 auto}
 main{padding:12px 10px 150px}
 .card{padding:14px;border-radius:10px}
 h2{font-size:16px}
 .cloud{line-height:1.9}.cloud a{margin-right:7px}
 .grid{grid-template-columns:1fr;gap:8px}
 .tabs{overflow-x:auto}.tabs button{padding:8px 10px;font-size:14px;white-space:nowrap}
 .filters{gap:5px}.filters .btn{padding:6px 9px;font-size:12.5px}
 .bars{height:56px}
 .ep .hd{flex-wrap:wrap;gap:2px 10px;padding:12px}
 .ep .hd .d{order:1;width:auto;font-size:12px}
 .ep .hd .n{order:2;margin-left:auto;font-size:13px}
 .ep .hd .t{order:3;flex:1 1 100%;font-size:15px;line-height:1.45}
 .ep .hd .btn{order:4;margin-top:6px;padding:4px 10px}
 .ep .sp{padding:0 12px 6px}.ep .qs{padding:2px 12px 10px}
 .q{flex-wrap:wrap;gap:2px 8px;font-size:14px}
 .q .tx{flex:1 1 100%}
 .q .btn{padding:3px 9px;font-size:12px}
 .cols{grid-template-columns:1fr}.col{max-height:none;padding:12px}
 .col .meta{line-height:1.5}
 .epv .top{flex-direction:column;gap:10px}
 .epv .top>div:last-child{white-space:normal!important;display:flex;gap:6px;flex-wrap:wrap}
 .epv .ttl{font-size:18px;line-height:1.4;word-break:keep-all}
 .namu{font-size:13.5px;padding:10px 12px}
 .find{flex-wrap:wrap}.find input{flex:1 1 55%;min-width:0}
 .epv .sub .btn{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:4px 0}
 .tr .q{padding:8px 2px}
 table.list,table.list tbody{display:block}
 table.list tr{display:flex;flex-wrap:wrap;border-top:1px solid var(--line);padding:9px 2px;gap:2px 10px}
 table.list td{border:0;padding:0;width:auto!important}
 table.list td:first-child{order:1;font-size:12px}
 table.list td:last-child{order:2;margin-left:auto;font-size:12px}
 table.list td:nth-child(2){order:3;flex:1 1 100%;line-height:1.45}
 table.list td:nth-child(3):not(:last-child){order:4;flex:1 1 100%;font-size:12px}
 .player{flex-wrap:wrap;padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:6px}
 .player .pt{flex:1 1 100%;max-width:100%;font-size:12.5px}
 .player audio{flex:1 1 100%;height:40px}
 .player iframe{width:100%!important;height:auto!important;aspect-ratio:16/9;max-height:200px}
 .player button{flex:1;padding:8px 0}
 footer{padding-bottom:150px!important}
}
</style></head><body>
<header>
  <a class="logo" href="#/">그것은 <span>알기 싫다</span> 아카이브</a>
  <nav><a href="#/" id="n-home">키워드</a><a href="#/panel" id="n-panel">패널</a><a href="#/episodes" id="n-eps">회차</a></nav>
  <form class="sbox" id="sf">
    <input type="search" id="q" placeholder='검색어 (예: 검찰개혁 / "평화의 댐" / 국정원 -댓글)'>
    <select id="spk"><option value="">모든 화자</option></select>
    <input type="month" id="from" title="시작"><input type="month" id="to" title="끝">
    <button>검색</button>
  </form>
</header>
<div class="load" id="load"><span id="ltxt">원고를 불러오는 중…</span><span class="bar"><i id="lbar"></i></span></div>
<div class="player" id="player"><span class="pt" id="ptitle"></span><audio id="aud" controls preload="none"></audio><iframe id="yt" allow="autoplay; encrypted-media" style="display:none;width:240px;height:135px;border:0;border-radius:6px"></iframe><button id="m15">−15초</button><button id="p15">+15초</button><button id="pclose">닫기</button></div>
<main id="app"><div class="empty">불러오는 중…</div></main>
<footer style="text-align:center;color:#999;font-size:12px;padding:0 16px 40px;line-height:1.7">「그것은 알기 싫다」 비공식 아카이브 · 원고는 음성 자동 인식 결과로 오류가 있을 수 있으며, 화자 이름은 목소리 자동 매칭(추정)입니다.<br>▶ 시각을 누르면 화면 아래 플레이어에서 해당 시점부터 재생됩니다 (XSFM 회차: XSFM 공식 SoundCloud 음원 / 딴지라디오 시절: 유튜브 사본). 모든 저작권은 XSFM과 출연자에게 있습니다.</footer>
<script>
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>(s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hms=t=>{t=+t;const h=t/3600|0,m=(t%3600)/60|0,s=t%60;return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(s).padStart(2,'0')};
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const col=s=>s.startsWith('화자')?'#999':`hsl(${hue(s)},55%,42%)`;
const who=s=>`<span class="who" style="color:${col(s)}">${esc(s)}</span>`;
let terms=[];
function hl(t){t=esc(t);if(!terms.length)return t;const re=new RegExp('('+terms.map(w=>esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');return t.replace(re,'<mark>$1</mark>')}
function setTerms(q){terms=(q.match(/"[^"]+"|-?\S+/g)||[]).filter(w=>!w.startsWith('-')).map(w=>w.replace(/"/g,'')).filter(Boolean)}
function go(h){location.hash=h}
function qs(o){return new URLSearchParams(Object.entries(o).filter(([k,v])=>v)).toString()}
function searchLink(q,extra={}){return '#/search?'+qs({q,...extra})}
// ---------- data ----------
let META,EP={},SPK=[],READY=false;const W=new Worker('worker.js');let reqId=0;const pending={};
W.onmessage=e=>{const m=e.data;
 if(m.type==='progress'){$('#lbar').style.width=(m.loaded/m.total*100).toFixed(0)+'%';$('#ltxt').textContent=`원고를 불러오는 중… ${m.loaded}/${m.total} (처음 한 번, 이후 검색은 즉시)`}
 else if(m.type==='ready'){READY=true;$('#load').style.display='none';if(location.hash.startsWith('#/search'))route()}
 else if(m.type==='error'){$('#ltxt').textContent='일부 원고를 불러오지 못했습니다. 새로고침해 주세요.'}
 else if(pending[m.id]){pending[m.id](m);delete pending[m.id]}};
const ask=(o)=>new Promise(r=>{const id=++reqId;pending[id]=r;W.postMessage({...o,id})});
async function gunzip(url){const r=await fetch(url);if(!r.ok)throw new Error(url);const b=new Uint8Array(await r.arrayBuffer());
 if(b[0]===0x1f&&b[1]===0x8b)return JSON.parse(await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text());return JSON.parse(new TextDecoder().decode(b))}
function epObj(a){return {id:a[0],no:a[1],date:a[2],title:a[3],folder:a[4],guests:a[5],dur:a[6],url:a[7],yt:a[8],namu:a[9]}}
function playUrl(e,t){t=Math.max(0,(t|0)-2);if(e.yt)return `https://www.youtube.com/watch?v=${e.yt}&t=${t}s`;if(e.url){const m=e.url.match(/\/stream\/\d+-xsfm-(.+)\.mp3$/);return m?`https://soundcloud.com/xsfm/${m[1]}`:''}return ''}
const aud=document.getElementById('aud');let curEp=null;
function play(id,t){const e=EP[id];if(!e)return;t=Math.max(0,(t|0)-2);const pl=$('#player');pl.style.display='flex';$('#ptitle').textContent=e.title;
 if(e.yt){aud.pause();aud.style.display='none';curEp=null;const f=$('#yt');f.style.display='block';f.src=`https://www.youtube-nocookie.com/embed/${e.yt}?start=${t}&autoplay=1`;return}
 $('#yt').style.display='none';$('#yt').src='about:blank';aud.style.display='block';
 if(curEp!==id){aud.src=e.url;curEp=id}
 if(aud.readyState>=1){aud.currentTime=t;aud.play().catch(()=>{})}else{aud.addEventListener('loadedmetadata',()=>{aud.currentTime=t},{once:true});aud.play().catch(()=>{})}}
document.addEventListener('click',ev=>{const a=ev.target.closest('[data-play]');if(!a)return;ev.preventDefault();ev.stopPropagation();play(+a.dataset.play,+a.dataset.t)},true);
function tsLink(e,t){return (e.url||e.yt)?`<a class="ts" href="#" data-play="${e.id}" data-t="${t}" title="이 지점부터 듣기">▶ ${hms(t)}</a>`:`<span class="ts">${hms(t)}</span>`}
// ---------- form ----------
$('#m15').onclick=()=>{aud.currentTime=Math.max(0,aud.currentTime-15)};$('#p15').onclick=()=>{aud.currentTime+=15};$('#pclose').onclick=()=>{aud.pause();$('#yt').src='about:blank';$('#player').style.display='none'};
$('#sf').onsubmit=e=>{e.preventDefault();const q=$('#q').value.trim();if(!q)return;go(searchLink(q,{speaker:$('#spk').value,from:$('#from').value,to:$('#to').value}))};
function nav(id){document.querySelectorAll('header nav a').forEach(a=>a.classList.toggle('on',a.id===id))}
// ---------- views ----------
function home(){nav('n-home');const kw=META.keywords;const mx=Math.log(kw[0]?.[2]||1),mn=Math.log(kw.at(-1)?.[2]||1);
 const eps=META.eps,nl=Object.values(META.spkeps).length;
 app.innerHTML=`<div class="card"><h2>아카이브</h2><div class="sub">${eps[0][2]} ~ ${eps.at(-1)[2]} · ${eps.length.toLocaleString()}개 회차 · 화자 이름은 목소리 자동 매칭(추정)</div>
 <div class="help">검색 팁: 여러 단어는 모두 포함(AND), <b>"평화의 댐"</b>처럼 따옴표는 구문 검색, <b>-단어</b>는 제외. 글자 일부만 맞아도 찾습니다(검찰 → 검찰이, 검찰청, 정치검찰).</div></div>
 <div class="card"><h2>키워드 <span class="sub">전 회차에서 많이 나온 주제어 · 클릭하면 관련 회차와 발언</span></h2><div class="cloud">${
  kw.slice().sort((a,b)=>a[0].localeCompare(b[0],'ko')).map(k=>{const s=12+(Math.log(k[2])-mn)/(mx-mn||1)*16;return `<a href="${searchLink(k[0])}" style="font-size:${s.toFixed(1)}px" title="${k[1]}개 회차 · ${k[2]}회">${esc(k[0])}</a>`}).join('')}</div></div>
 <div class="card"><h2>패널 <span class="sub">클릭하면 그 사람이 자주 다룬 주제</span></h2><div class="grid">${SPK.slice(0,12).map(pcard).join('')}</div></div>`}
function pcard(s){return `<a class="pcard" href="#/panel/${encodeURIComponent(s.name)}"><span class="dot" style="background:${col(s.name)}"></span><b>${esc(s.name)}</b>
 <div class="sub">${s.eps}개 회차 · ${s.first.slice(0,4)}~${s.last.slice(0,4)}</div><div class="kw">${s.top.slice(0,10).map(esc).join(' · ')}</div></a>`}
function panels(){nav('n-panel');app.innerHTML=`<div class="card"><h2>패널 · 출연자 <span class="sub">${SPK.length}명</span></h2><div class="grid">${SPK.map(pcard).join('')}</div></div>`}
function panel(name){nav('n-panel');const s=SPK.find(x=>x.name===name);if(!s){app.innerHTML='<div class="empty">없음</div>';return}
 const list=(META.spkeps[name]||[]).map(([id,n])=>[EP[id],n]).sort((a,b)=>b[0].date.localeCompare(a[0].date));
 app.innerHTML=`<div class="card"><div class="sub"><a href="#/panel">← 패널 목록</a></div><h2 style="font-size:22px;margin-top:8px"><span class="dot" style="background:${col(name)}"></span>${esc(name)}</h2>
 <div class="sub">${s.eps}개 회차 출연 · 발언 ${s.nlines.toLocaleString()}개 · ${s.first} ~ ${s.last}</div>
 <h3 style="margin-top:16px">${esc(name)}이(가) 자주 다룬 키워드 <span class="sub">클릭하면 이 사람의 해당 발언만</span></h3>
 <div class="chips">${s.top.map(k=>`<a href="${searchLink(k,{speaker:name})}">${esc(k)}</a>`).join('')}</div>
 <form class="find" id="pf"><input name="k" placeholder="${esc(name)}의 발언에서 검색"><button class="btn acc">검색</button></form></div>
 <div class="card"><h2>출연 회차 <span class="sub">${list.length}개 · 발언 수</span></h2><table class="list">${list.map(([e,n])=>`<tr data-ep="${e.id}"><td class="sub" style="width:96px">${e.date}</td><td><b>${esc(e.title)}</b></td><td class="sub" style="width:70px">${n}회</td></tr>`).join('')}</table></div>`;
 $('#pf').onsubmit=ev=>{ev.preventDefault();go(searchLink(ev.target.k.value,{speaker:name}))};bindRows()}
function bindRows(){document.querySelectorAll('tr[data-ep]').forEach(r=>r.onclick=()=>go('#/ep/'+r.dataset.ep))}
function episodes(p){nav('n-eps');const q=(p.get('q')||'').toLowerCase();
 const list=META.eps.map(epObj).filter(e=>!q||(e.title+' '+e.guests+' '+e.namu).toLowerCase().includes(q)).reverse();
 app.innerHTML=`<div class="card"><h2>회차 목록 <span class="sub">${list.length}개</span></h2>

async function search(p){nav('');const q=p.get('q');setTerms(q);$('#q').value=q;$('#spk').value=p.get('speaker')||'';$('#from').value=p.get('from')||'';$('#to').value=p.get('to')||'';
 const tab=p.get('tab')||'ep',sort=p.get('sort')||'hits';
 const key=JSON.stringify(['q','speaker','from','to'].map(k=>p.get(k)));
 let d;
 if(lastSearch&&lastSearch.key===key&&lastSearch.complete)d=lastSearch.d;
 else{app.innerHTML=`<div class="empty">${READY?'검색 중…':'원고를 불러오는 대로 검색합니다…'}</div>`;
  const r=await ask({type:'search',q,speaker:p.get('speaker')||'',from:p.get('from')||'',to:p.get('to')||''});
  d=aggregate(q,r.hits);d.complete=r.complete;lastSearch={key,d,complete:r.complete}}
 if(!d.total){app.innerHTML=`<div class="empty">「${esc(q)}」 결과가 없습니다.${d.complete?'':'<br>(원고를 아직 불러오는 중이라, 끝나면 다시 검색합니다)'}</div>`;return}
 const base=Object.fromEntries(p),link=o=>'#/search?'+qs({...base,...o});
 let eps=d.episodes.slice();if(sort==='hits')eps.sort((a,b)=>b.hits-a.hits);else if(sort==='new')eps.reverse();
 const ymax=Math.max(...d.years.map(y=>y[1]));
 let h=`<div class="card"><h2>「${esc(q)}」 ${p.get('speaker')?`<span class="chip">${esc(p.get('speaker'))}의 발언만 <a href="${link({speaker:''})}">✕</a></span>`:''}</h2>
 <div class="sub">${d.episodes.length}개 회차 · 발언 ${d.total.toLocaleString()}개${d.total>=20000?' (상위 20,000개까지만 집계)':''}${d.complete?'':' · 원고를 불러오는 중이라 일부 결과만 표시'}</div>
 <div class="bars">${d.years.map(([y,n])=>`<div style="height:${(n/ymax*100).toFixed(0)}%" title="${y}년 ${n}건" data-go="${link({from:y+'-01',to:y+'-12'})}"><span>${y.slice(2)}</span></div>`).join('')}</div>
 ${d.related.length?`<h3 style="margin-top:28px">함께 나온 키워드 <span class="sub">클릭하면 검색어에 추가</span></h3><div class="chips">${d.related.map(([k,c])=>`<a href="${link({q:q+' '+k,tab})}">${esc(k)} <span class="sub">${c}</span></a>`).join('')}</div>`:''}</div>
 <div class="tabs"><button class="${tab==='ep'?'on':''}" data-go="${link({tab:'ep'})}">회차별 (${d.episodes.length})</button><button class="${tab==='sp'?'on':''}" data-go="${link({tab:'sp'})}">패널별 발언 비교 (${d.speakers.length})</button></div>`;
 if(tab==='ep'){
  h+=`<div class="filters"><span class="sub" style="padding-top:6px">정렬</span>${[['hits','많이 언급된 순'],['old','오래된 순'],['new','최신 순']].map(([k,l])=>`<button class="btn ${sort===k?'acc':''}" data-go="${link({sort:k})}">${l}</button>`).join('')}
   <button class="btn" id="openall">모두 펼치기</button></div>`;
  h+=eps.slice(0,300).map((e,i)=>`<div class="ep ${i<3?'open':''}"><div class="hd"><span class="d">${e.date}</span><span class="t">${esc(e.title)}</span><span class="n">${e.hits}건</span>
   <a class="btn" href="#/ep/${e.id}?q=${encodeURIComponent(q)}">전문</a></div>
   <div class="sp">${e.speakers.map(([s,n])=>`<span class="chip">${who(s)} ${n}</span>`).join('')}</div>
   <div class="qs">${e.quotes.map(x=>`<div class="q">${tsLink(e,x.t)}${who(x.speaker)}<span class="tx">${hl(x.text)}</span>
    <a class="btn" href="#/ep/${e.id}?line=${x.i}&q=${encodeURIComponent(q)}" title="앞뒤 맥락 보기">맥락</a></div>`).join('')}${e.hits>e.quotes.length?`<div class="sub" style="padding-top:6px">외 ${e.hits-e.quotes.length}건 — 전문에서 확인</div>`:''}</div></div>`).join('');
  if(eps.length>300)h+=`<div class="empty">상위 300개 회차만 표시했습니다. 검색어를 좁혀 보세요.</div>`;
 } else {
  h+=`<div class="sub" style="margin-bottom:10px">같은 키워드에 대해 패널마다 무슨 말을 했는지 나란히 비교합니다. 이름을 누르면 그 사람 발언만 모아 봅니다.</div><div class="cols">${d.speakers.map(s=>`<div class="col">
   <h3><a href="${link({speaker:s.name,tab:'ep'})}">${who(s.name)}</a> <span class="sub">${s.count}건 · ${s.eps}개 회차</span></h3>
   ${s.quotes.map(x=>{const e=EP[x.ep];return `<div class="q"><div class="meta"><a href="#/ep/${x.ep}?line=${x.i}&q=${encodeURIComponent(q)}">${e.date} · ${esc(e.title)}</a> ${tsLink(e,x.t)}</div><div class="tx">${hl(x.text)}</div></div>`}).join('')}
   ${s.count>s.quotes.length?`<div class="sub" style="padding-top:6px">${s.count}건 중 시기별로 ${s.quotes.length}건 표시</div>`:''}</div>`).join('')}</div>`;
 }
 app.innerHTML=h;
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
 document.querySelectorAll('.ep .hd').forEach(hd=>hd.onclick=ev=>{if(ev.target.closest('a'))return;hd.parentNode.classList.toggle('open')});
 const oa=$('#openall');if(oa)oa.onclick=()=>document.querySelectorAll('.ep').forEach(e=>e.classList.add('open'));
 window.scrollTo(0,0)}
function aggregate(q,hits){const byEp=new Map(),bySp=new Map(),years={};
 for(const [ep,i,t,s,text] of hits){const sp=META.spk[s];const x={ep,i,t,speaker:sp,text};
  if(!byEp.has(ep))byEp.set(ep,[]);byEp.get(ep).push(x);if(!bySp.has(sp))bySp.set(sp,[]);bySp.get(sp).push(x);const y=EP[ep].date.slice(0,4);years[y]=(years[y]||0)+1}
 const episodes=[...byEp].map(([ep,rs])=>{const c={};rs.forEach(r=>c[r.speaker]=(c[r.speaker]||0)+1);
  return {...EP[ep],hits:rs.length,speakers:Object.entries(c).sort((a,b)=>b[1]-a[1]),quotes:rs.slice(0,40)}});
 const speakers=[...bySp].sort((a,b)=>(a[0].startsWith('화자')-b[0].startsWith('화자'))||b[1].length-a[1].length).map(([name,rs])=>{const step=Math.max(1,Math.floor(rs.length/30));const qs=[];for(let i=0;i<rs.length&&qs.length<30;i+=step)qs.push(rs[i]);
  return {name,count:rs.length,eps:new Set(rs.map(r=>r.ep)).size,quotes:qs}});
 const qw=terms.map(w=>w.toLowerCase());const rc={};
 for(const ep of [...byEp.keys()].slice(0,800))for(const k of (META.epkw[ep]||[]))rc[k]=(rc[k]||0)+1;
 const related=Object.entries(rc).filter(([k])=>!qw.some(w=>k.toLowerCase().includes(w)||w.includes(k.toLowerCase()))).sort((a,b)=>b[1]-a[1]).slice(0,30);
 return {total:hits.length,episodes,speakers,years:Object.entries(years).sort(),related}}
async function episode(id,p){nav('');id=+id;const e=EP[id];if(!e){app.innerHTML='<div class="empty">없는 회차</div>';return}
 app.innerHTML='<div class="empty">불러오는 중…</div>';const r=await ask({type:'episode',ep:id});
 if(r.error){app.innerHTML='<div class="empty">원고를 불러오지 못했습니다. 새로고침해 주세요.</div>';return}
 const q=p.get('q')||'';setTerms(q);const line=p.has('line')?+p.get('line'):-1;
 const lines=r.lines.map((l,i)=>({i,t:l[0],speaker:META.spk[l[1]],text:l[2]}));
 const cnt={};lines.forEach(l=>cnt[l.speaker]=(cnt[l.speaker]||0)+1);
 const nb=[EP[id-1],EP[id+1]].filter(Boolean);const pu=playUrl(e,0);
 app.innerHTML=`<div class="card epv"><div class="top"><div><div class="sub">${e.folder.startsWith('01')?'딴지라디오 시절':'XSFM'} · ${e.date} · ${hms(e.dur)} ${e.guests?'· '+esc(e.guests):''}</div>
  <div class="ttl">${esc(e.title)}</div></div><div style="white-space:nowrap">${pu?`<a class="btn acc" href="#" data-play="${e.id}" data-t="2">▶ 처음부터 듣기</a> <a class="btn" href="${esc(pu)}" target="_blank" rel="noopener">${e.yt?'유튜브':'SoundCloud'}에서 보기</a>`:''}</div></div>
  <div class="chips" style="margin-top:10px">${Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([s,n])=>`<a href="${s.startsWith('화자')?'#/ep/'+id:'#/panel/'+encodeURIComponent(s)}"><span class="dot" style="background:${col(s)}"></span>${esc(s)} ${n}</a>`).join('')}</div>
  <div class="chips">${(META.epkw[id]||[]).map(k=>`<a href="${searchLink(k)}">#${esc(k)}</a>`).join('')}</div>
  ${e.namu?`<div class="namu"><b>나무위키 요약</b> — ${esc(e.namu)}</div>`:''}
  <div class="find"><input id="ef" value="${esc(q)}" placeholder="이 회차 안에서 찾기"><button class="btn" id="fn">다음</button><button class="btn" id="fp">이전</button></div>
  <div class="sub">${nb.map(n=>`<a class="btn" href="#/ep/${n.id}">${n.id<id?'← 이전':'다음 →'} ${esc(n.title.slice(0,30))}</a>`).join(' ')}</div></div>
 <div class="card tr">${lines.map(l=>`<div class="q" id="L${l.i}">${tsLink(e,l.t)}${who(l.speaker)}<span class="tx">${hl(l.text)}</span></div>`).join('')}</div>`;
 $('#fn').onclick=()=>efind(1);$('#fp').onclick=()=>efind(-1);
 $('#ef').onkeydown=ev=>{if(ev.key==='Enter')efind(1)};$('#ef').oninput=()=>{setTerms($('#ef').value);document.querySelectorAll('.tr .q').forEach(r=>{const tx=r.querySelector('.tx');tx.innerHTML=hl(tx.textContent)});fi=-1};
 if(line>=0){const el=$('#L'+line);if(el){el.classList.add('hit');setTimeout(()=>el.scrollIntoView({block:'center'}),50)}}else window.scrollTo(0,0)}
let fi=-1;function efind(d){const hs=[...document.querySelectorAll('.tr .q')].filter(r=>r.querySelector('mark'));if(!hs.length)return;
 document.querySelectorAll('.tr .q.hit').forEach(r=>r.classList.remove('hit'));fi=(fi+d+hs.length)%hs.length;hs[fi].classList.add('hit');hs[fi].scrollIntoView({block:'center'})}
async function route(){const h=location.hash.slice(1)||'/';const [path,query]=h.split('?');const p=new URLSearchParams(query||'');const seg=path.split('/').filter(Boolean);
 try{if(!seg.length)home();else if(seg[0]==='search')await search(p);else if(seg[0]==='ep')await episode(seg[1],p);
 else if(seg[0]==='panel')seg[1]?panel(decodeURIComponent(seg[1])):panels();else if(seg[0]==='episodes')episodes(p);else home()}
 catch(err){app.innerHTML=`<div class="empty">오류: ${esc(err.message)}</div>`}}
(async()=>{try{META=await gunzip('meta.gz')}catch(e){app.innerHTML='<div class="empty">데이터를 불러오지 못했습니다. 새로고침해 주세요.</div>';return}
